name: Build

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package
        env:
          CRX_TEST_PEM: ${{ secrets.CRX_TEST_PEM }}
        run: |
          VERSION=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src/manifest.json | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./build.sh

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: |
            dist/noname.zip
            dist/noname.crx

      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/noname.zip
            dist/noname.crx
